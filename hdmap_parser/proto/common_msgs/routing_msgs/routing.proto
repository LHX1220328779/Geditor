syntax = "proto2";

package map_engine.routing;

import "common_msgs/routing_msgs/geometry.proto";
import "common_msgs/basic_msgs/header.proto";
import "common_msgs/basic_msgs/error_code.proto";
import "common_msgs/routing_msgs/poi.proto";

message RoutingRequest {
  optional map_engine.common.Header header = 1;
  // at least two points. The first is start point, the end is final point.
  // The routing must go through each point in waypoint.
  repeated map_engine.routing.LaneWaypoint waypoint = 2;
  repeated map_engine.routing.LaneSegment blacklisted_lane = 3;
  repeated string blacklisted_road = 4;
  optional bool broadcast = 5 [default = true];
  optional map_engine.routing.ParkingInfo parking_info = 6 [deprecated = true];
  // If the start pose is set as the first point of "way_point".
  optional bool is_start_pose_set = 7 [default = false];
}

message RoutingResponse {
  optional map_engine.common.Header header = 1;
  repeated map_engine.routing.RoadSegment road = 2;
  optional map_engine.routing.Measurement measurement = 3;
  optional RoutingRequest routing_request = 4;

  // the map version which is used to build road graph
  optional bytes map_version = 5;
  optional map_engine.common.StatusPb status = 6;
}
