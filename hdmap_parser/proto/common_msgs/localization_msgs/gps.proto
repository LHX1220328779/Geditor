syntax = "proto2";

package map_engine.localization;

import "common_msgs/basic_msgs/header.proto";
import "common_msgs/localization_msgs/pose.proto";

message Gps {
  optional map_engine.common.Header header = 1;

  // Localization message: from GPS or localization
  optional map_engine.localization.Pose localization = 2;
}
