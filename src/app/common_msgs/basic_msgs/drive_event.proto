syntax = "proto2";

package map_engine.common;

import "common_msgs/basic_msgs/header.proto";
import "common_msgs/localization_msgs/pose.proto";

message DriveEvent {
  enum Type {
    CRITICAL = 0;
    PROBLEM = 1;
    DESIRED = 2;
    OUT_OF_SCOPE = 3;
  }

  optional map_engine.common.Header header = 1;
  optional string event = 2;
  optional map_engine.localization.Pose location = 3;
  repeated Type type = 4;
  optional bool is_reportable = 5;
}
